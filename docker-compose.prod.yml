# Продакшн-compose для сервера: тянет готовый образ из Docker Hub, ничего не собирает.
# На сервере нужен только этот файл — исходники клонировать не обязательно.
#
# Запуск:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Обновление на новую версию (после того как локально собрали и запушили новый образ):
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# (сделает docker compose down + up автоматически, данные в volume не тронет)

name: moi-finansy

services:
  finance:
    image: shadowkick/finance:latest
    container_name: finance
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      # Общий auth-сервис. ОБЯЗАТЕЛЬНО и ровно тот адрес, что задан у auth в ISSUER:
      # он подписан внутрь токенов и сверяется побайтово. Без него сервис не стартует.
      AUTH_ISSUER: https://auth.burninghouse.ru
      AUTH_CLIENT_ID: finance
      # Этот сервис должен быть зарегистрирован в auth как клиент:
      #   docker compose exec auth node server.js client-add finance "Мои финансы" https://money.burninghouse.ru/
      # Регистрацией и паролями заведует auth — здесь их настроек больше нет.
      # Фронт и API — на одном домене, CORS не нужен.
    ports:
      # Только на localhost — наружу отдаёт nginx на порту 443 (см. README-deploy.md).
      - "127.0.0.1:8787:8787"
    volumes:
      - finance-data:/app/data

volumes:
  finance-data:
