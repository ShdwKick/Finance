# Reverse-proxy для «Мои финансы» на порту 9443 — используется, когда TCP 443 занят VPN
# (3x-ui/Reality/VLESS). Порт 9443 выбран после проверки `ss -tulpn` на конкретном сервере —
# на нём уже заняты 443 (xray VLESS), 2096/11111/62789 (xray), 29340 (x-ui панель),
# 8443/udp (Hysteria2), 51820-51821 (WireGuard в docker), 10050 (zabbix), 8080 (docker-proxy).
# Этот конфиг ничего из перечисленного не трогает.
#
# Установка:
#   1) sudo cp deploy/nginx-finance-9443.conf /etc/nginx/sites-available/finance
#   2) sudo ln -s /etc/nginx/sites-available/finance /etc/nginx/sites-enabled/
#   3) sudo nginx -t && sudo systemctl reload nginx
#   4) sudo ufw allow 9443/tcp   # если включён firewall
#
# Сертификат получить ДО первого запуска этого конфига (иначе nginx не стартует —
# файлы сертификата ещё не существуют):
#   sudo certbot certonly --standalone -d money.burninghouse.ru
# (--standalone на секунду занимает порт 80, затем освобождает — остальные порты не трогает)

server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    server_name money.burninghouse.ru;

    ssl_certificate     /etc/letsencrypt/live/money.burninghouse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/money.burninghouse.ru/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
