# Reverse-proxy для «Мои финансы» на порту 8443 — используется, когда TCP 443 занят VPN
# (3x-ui/Reality/VLESS). Порт 443 (TCP и UDP, включая Hysteria2) этот конфиг не трогает.
#
# Установка:
#   1) sudo cp deploy/nginx-finance-8443.conf /etc/nginx/sites-available/finance
#   2) sudo ln -s /etc/nginx/sites-available/finance /etc/nginx/sites-enabled/
#   3) sudo nginx -t && sudo systemctl reload nginx
#   4) sudo ufw allow 8443/tcp   # если включён firewall
#
# Сертификат получить ДО первого запуска этого конфига (иначе nginx не стартует —
# файлы сертификата ещё не существуют):
#   sudo certbot certonly --standalone -d money.burninghouse.ru
# (--standalone на секунду занимает порт 80, затем освобождает — 443 не трогает вообще)

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name money.burninghouse.ru;

    ssl_certificate     /etc/letsencrypt/live/money.burninghouse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/money.burninghouse.ru/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
