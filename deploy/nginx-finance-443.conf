# Reverse-proxy для «Мои финансы» на стандартном порту 443 (money.burninghouse.ru).
# Раньше здесь висел xray (VLESS), поэтому приложение временно жило на 9443 — после
# того как xray-инбаунд на 443 убрали, порт освободился и переехал сюда: адрес сайта
# теперь без явного порта (https://money.burninghouse.ru).
#
# Установка (если конфиг уже был на 9443 — просто заменяет старый файл и порт):
#   1) sudo cp deploy/nginx-finance-443.conf /etc/nginx/sites-available/finance
#   2) sudo ln -s /etc/nginx/sites-available/finance /etc/nginx/sites-enabled/   # если ещё не слинковано
#   3) sudo nginx -t && sudo systemctl reload nginx
#   4) sudo ufw allow 443/tcp   # если включён firewall
#   5) sudo ufw delete allow 9443/tcp   # старое правило больше не нужно, если было
#
# Сертификат уже должен существовать (получен раньше через certbot certonly --standalone)
# — порт в сертификате не участвует, перевыпускать не нужно.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name money.burninghouse.ru;

    ssl_certificate     /etc/letsencrypt/live/money.burninghouse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/money.burninghouse.ru/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
