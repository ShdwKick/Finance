name: bh-finansy

services:
  finance:
    build: .
    image: shadowkick/finance:latest
    container_name: finance
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      # Адрес общего auth-сервиса. Обязателен: без него сервер не стартует, потому что
      # проверять токены нечем. Локально — см. docker-compose.dev.yml в репозитории Auth,
      # он поднимает оба сервиса разом и всё прописывает сам.
      AUTH_ISSUER: http://localhost:8788
      AUTH_CLIENT_ID: finance
      # Если фронтенд отдаётся отдельно (напр. GitHub Pages), а этот контейнер — только API:
      # ALLOWED_ORIGIN: https://burning-house.online
    ports:
      # По умолчанию слушаем только на localhost — наружу отдаёт nginx (см. README-deploy.md).
      # Если хотите достучаться до контейнера напрямую без nginx, поменяйте на "8787:8787".
      - "127.0.0.1:8787:8787"
    volumes:
      - finance-data:/app/data

volumes:
  finance-data:
